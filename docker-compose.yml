services:
  db:
    build:
      context: ./giuaky_Cao_Khanh_Linh/db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dictuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dictpass}
      POSTGRES_DB: ${POSTGRES_DB:-dictionary}
    volumes:
      - db-data:/var/lib/postgresql/data

  web:
    build:
      context: .
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-dictuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dictpass}
      DB_NAME: ${POSTGRES_DB:-dictionary}
      PORT: 3000
    depends_on:
      - db

volumes:
  db-data:
