version: '3.8'

services:
  # 1. Database (PostgreSQL)
  db:
    build:
      context: ./db
    ports:
      - "${DB_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tuandev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DongA@2026}
      POSTGRES_DB: ${POSTGRES_DB:-tudien}
    volumes:
      - db-data:/var/lib/postgresql/data

  # 2. Backend (Node.js/Express)
  backend:
    image: node:18-alpine
    working_dir: /app
    # Mount source code từ máy vào container để khi bạn code nó tự nhận (hot-reload / dev)
    volumes:
      - ./backend:/app
    # Chạy lệnh install các package và start server
    command: sh -c "npm install && npm start"
    ports:
      - "${WEB_PORT:-8080}:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-tuandev}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-DongA@2026}
      DB_NAME: ${POSTGRES_DB:-tudien}
      PORT: 3000
    depends_on:
      - db

  # 3. Frontend (React/Vite)
  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    # Chạy npm install và khởi chạy vite dev server, expose ra mạng ngoài bằng --host
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db-data:
