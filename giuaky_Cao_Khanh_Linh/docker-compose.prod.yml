services:
  # 1. Database (PostgreSQL)
  db:
    image: linh105463/dictionary-db:latest
    ports:
      - "${DB_PORT:-55433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tuandev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DongA@2026}
      POSTGRES_DB: ${POSTGRES_DB:-tudien}
    volumes:
      - db-data:/var/lib/postgresql/data

  # 2. Backend (Node.js/Express)
  backend:
    image: linh105463/dictionary-backend:latest
    ports:
      - "${WEB_PORT:-8080}:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-tuandev}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-DongA@2026}
      DB_NAME: ${POSTGRES_DB:-tudien}
      PORT: 3000
    depends_on:
      - db

  # 3. Frontend (React/Vite)
  frontend:
    image: linh105463/dictionary-frontend:latest
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db-data:
